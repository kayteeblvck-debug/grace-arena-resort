spring:
  application:
    name: grace_arena_resort

  datasource:
    url: jdbc:h2:mem:grace_arena;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.gracearena.resort: DEBUG
